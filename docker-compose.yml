version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chunks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chunks
      POSTGRES_PASSWORD: chunks123
      POSTGRES_DB: chunks_money
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./split-payment-schema.sql:/docker-entrypoint-initdb.d/01-init.sql

  redis:
    image: redis:7-alpine
    container_name: chunks_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
